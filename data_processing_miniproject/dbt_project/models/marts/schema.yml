
version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product_category
    columns:
      - name: product_category
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: product_category
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product_category')
                field: product_category

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['paid', 'shipped', 'cancelled', 'refunded']

      - name: net_amount
        data_tests:
          - not_null
